<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dockerfile Portfolio Lab</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0288d1; /* Docker Blue */
            --primary-dark: #01579b;
            --accent-color: #00e676; /* Success Green */
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --text-muted: #7f8c8d;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 650px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-top: 6px solid var(--primary-color);
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Headings */
        .project-name {
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .version {
            display: inline-block;
            background-color: #e0f2fe;
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* Tech Section */
        .tech-section {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
        }

        .tech-section h2 {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .tech-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .tech-item {
            background-color: white;
            border: 1px solid #e0e0e0;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            transition: transform 0.2s, border-color 0.2s;
        }

        .tech-item:hover {
            transform: translateY(-3px);
            border-color: var(--primary-color);
        }

        .tech-icon {
            font-size: 1.2rem;
        }

        /* Footer */
        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Status Badge -->
        <div class="status-badge">
            <span class="status-dot"></span>
            Running Successfully!
        </div>

        <!-- Project Name & Title -->
        <div class="project-name">Dockerfile Portfolio Lab</div>
        <h1>This application is running live inside a Docker Container 🚀</h1>
        
        <!-- Version -->
        <div class="version">Version: v1.0.0</div>

        <!-- Technologies Used -->
        <div class="tech-section">
            <h2>🛠️ Technologies Used in this Lab:</h2>
            <ul class="tech-list">
                <li class="tech-item">
                    <span class="tech-icon">🐳</span> Dockerfile
                </li>
                <li class="tech-item">
                    <span class="tech-icon">⚡</span> Nginx Web Server
                </li>
                <li class="tech-item">
                    <span class="tech-icon">🌐</span> HTML5 / CSS3
                </li>
            </ul>
        </div>

        <footer>
            <p>Designed for deployment testing and containerization practice 💻</p>
        </footer>
    </div>

</body>
</html>
